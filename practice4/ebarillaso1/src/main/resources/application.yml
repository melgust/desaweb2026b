spring:
  application:
    name: catalog-service
  data:
    mongodb:
      # These use Spring Boot's official relaxed environment-variable binding
      # (SPRING_DATA_MONGODB_HOST, _PORT, _USERNAME, _PASSWORD,
      # _AUTHENTICATION_DATABASE, _DATABASE). This is more reliable in Docker
      # than relying on a single custom URI placeholder.
      host: ${SPRING_DATA_MONGODB_HOST:localhost}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      username: ${SPRING_DATA_MONGODB_USERNAME:catalog}
      password: ${SPRING_DATA_MONGODB_PASSWORD:catalog}
      authentication-database: ${SPRING_DATA_MONGODB_AUTHENTICATION_DATABASE:admin}
      database: ${SPRING_DATA_MONGODB_DATABASE:catalog}
      # Creates the indexes declared with @Indexed (e.g. unique sku/slug) on
      # startup. MongoDB has no schema/migration tool like Flyway; indexes are
      # the closest equivalent to the constraints PostgreSQL enforced.
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        # Only expose what we need; do not expose everything.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: catalog-service
    description: Catalog microservice for an online store (MongoDB variant)
    security: "DISABLED (no OAuth2/OIDC/JWT, no API Gateway) - current stage"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
