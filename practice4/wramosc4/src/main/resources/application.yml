spring:
  application:
    name: catalog-service

  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://catalog:catalog@localhost:27017/catalog?authSource=admin&uuidRepresentation=standard}
      auto-index-creation: true

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

springdoc:
  swagger-ui:
    path: /swagger-ui.html