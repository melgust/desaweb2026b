services:

  mongo:
    image: mongo:8
    container_name: catalog-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      MONGODB_URI: mongodb://mongo:27017/catalog
      SERVER_PORT: 8080
    ports:
      - "8080:8080"

volumes:
  mongo-data: