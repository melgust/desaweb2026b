spring:
  application:
    name: catalog-service
  data:
    mongodb:
      uri: ${MONGODB_URI:mongodb://localhost:27017/catalog}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        # Only expose what we need; do not expose everything.
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: catalog-service
    description: "Microservicio de Catálogo en MongoDB - Laboratorio de Desarrollo Web (4to Año)"
    security: "DISABLED (no OAuth2/OIDC/JWT, no API Gateway) - current stage"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs
