services:
  catalog-mongo:
    image: mongo:latest
    container_name: catalog-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: catalog-service
    depends_on:
      catalog-mongo:
        condition: service_healthy
    environment:
      - SPRING_MONGODB_URI=mongodb://catalog-mongo:27017/catalogdb
    ports:
      - "8080:8080"

volumes:
  mongo-data: