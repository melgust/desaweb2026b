services:

  mongodb:
    image: mongo:8.0
    container_name: macifuinaj-catalog-mongodb

    ports:
      - "27017:27017"

    volumes:
      - mongodb-data:/data/db

    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  catalog-service:
    build:
      context: .
      dockerfile: Dockerfile

    container_name: macifuinaj-catalog-service

    depends_on:
      mongodb:
        condition: service_healthy

    environment:
      MONGODB_URI: mongodb://mongodb:27017/catalog
      SERVER_PORT: 8080

    ports:
      - "8080:8080"

volumes:
  mongodb-data: