spring:
  application:
    name: catalog-service
  data:
    mongodb:
      host: ${SPRING_DATA_MONGODB_HOST:catalog-mongodb}
      port: ${SPRING_DATA_MONGODB_PORT:27017}
      database: catalog

server:
  port: ${SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: when_authorized
  info:
    env:
      enabled: true

info:
  app:
    name: catalog-service
    description: Catalog microservice for an online store using MongoDB
    security: "DISABLED (no OAuth2/OIDC/JWT, no API Gateway) - current stage"

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs