<div class="form-container">
  <h2>{{ isEditMode ? 'Edit Product' : 'New Product' }}</h2>

  <form (ngSubmit)="onSubmit()">

    <mat-form-field appearance="outline">
      <mat-label>Name</mat-label>
      <input
        matInput
        [(ngModel)]="formData.name"
        name="name"
        required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Description</mat-label>
      <textarea
        matInput
        [(ngModel)]="formData.description"
        name="description">
      </textarea>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Price</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="formData.price"
        name="price"
        required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Stock</mat-label>
      <input
        matInput
        type="number"
        [(ngModel)]="formData.stock"
        name="stock"
        required />
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Supplier</mat-label>

      <mat-select
        [(ngModel)]="formData.supplierId"
        name="supplierId">

        <mat-option [value]="null">
          No supplier
        </mat-option>

        <mat-option
          *ngFor="let supplier of suppliers()"
          [value]="supplier.id">
          {{ supplier.name }}
        </mat-option>

      </mat-select>
    </mat-form-field>

    <mat-form-field appearance="outline">
      <mat-label>Category</mat-label>

      <mat-select
        [(ngModel)]="formData.categoryId"
        name="categoryId">

        <mat-option [value]="null">
          No category
        </mat-option>

        <mat-option
          *ngFor="let category of categories()"
          [value]="category.id">
          {{ category.name }}
        </mat-option>

      </mat-select>
    </mat-form-field>

    <mat-checkbox
      [(ngModel)]="formData.isActive"
      name="isActive">
      Active
    </mat-checkbox>

    <div class="form-actions">

      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="loading">
        {{ isEditMode ? 'Update' : 'Create' }}
      </button>

      <button
        mat-button
        type="button"
        routerLink="/products">
        Cancel
      </button>

    </div>

  </form>
</div>
