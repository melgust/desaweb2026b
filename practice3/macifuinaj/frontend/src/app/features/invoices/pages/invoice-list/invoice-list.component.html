<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title mb-0">Invoices</h3>

    <a
      *ngIf="auth.canManageProducts()"
      routerLink="/invoices/new"
      class="btn btn-primary btn-sm">
      + New Invoice
    </a>
  </div>

  <div class="card-body">

    <mat-progress-bar
      *ngIf="loading()"
      mode="indeterminate">
    </mat-progress-bar>

    <div class="mat-elevation-z1 table-container">

      <table
        mat-table
        [dataSource]="invoices()">

        <!-- Date -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>
            Date
          </th>

          <td mat-cell *matCellDef="let item">
            {{ item.date | date:'dd/MM/yyyy HH:mm' }}
          </td>
        </ng-container>

        <!-- Client -->
        <ng-container matColumnDef="client">
          <th mat-header-cell *matHeaderCellDef>
            Client
          </th>

          <td mat-cell *matCellDef="let item">
            {{ item.clientName }}
          </td>
        </ng-container>

        <!-- Total -->
        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef>
            Total
          </th>

          <td mat-cell *matCellDef="let item">
            Q {{ item.total | number:'1.2-2' }}
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>
            Actions
          </th>

          <td mat-cell *matCellDef="let item">
            <a
              mat-icon-button
              color="primary"
              [routerLink]="['/invoices', item.id]"
              title="View invoice">

              <mat-icon>visibility</mat-icon>
            </a>
          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns;">
        </tr>

        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell text-center py-3"
            [attr.colspan]="displayedColumns.length">

            {{ loading() ? 'Loading data...' : 'No invoices found.' }}

          </td>
        </tr>

      </table>

      <mat-paginator
        [length]="totalItems()"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>

    </div>
  </div>
</div>
