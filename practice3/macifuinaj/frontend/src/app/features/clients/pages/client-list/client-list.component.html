<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title mb-0">Clients</h3>

    <a
      *ngIf="auth.canManageProducts()"
      routerLink="/clients/new"
      class="btn btn-primary btn-sm">
      + Add Client
    </a>
  </div>

  <div class="card-body">

    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search clients</mat-label>

      <input
        matInput
        placeholder="Type and press Enter"
        [(ngModel)]="searchTerm"
        (keyup.enter)="onSearchChange()" />

      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-progress-bar
      *ngIf="loading()"
      mode="indeterminate">
    </mat-progress-bar>

    <div class="mat-elevation-z1 table-container">

      <table
        mat-table
        [dataSource]="clients()"
        matSort
        (matSortChange)="onSortChange($event)"
        [matSortActive]="sortBy"
        [matSortDirection]="sortDirection">

        <!-- Name -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            Name
          </th>

          <td mat-cell *matCellDef="let item">
            {{ item.name }}
          </td>
        </ng-container>

        <!-- NIT -->
        <ng-container matColumnDef="nit">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>
            NIT
          </th>

          <td mat-cell *matCellDef="let item">
            {{ item.nit || '-' }}
          </td>
        </ng-container>

        <!-- Address -->
        <ng-container matColumnDef="address">
          <th mat-header-cell *matHeaderCellDef>
            Address
          </th>

          <td mat-cell *matCellDef="let item">
            {{ item.address || '-' }}
          </td>
        </ng-container>

        <!-- Active -->
        <ng-container matColumnDef="isActive">
          <th mat-header-cell *matHeaderCellDef>
            Active
          </th>

          <td mat-cell *matCellDef="let item">
            <span
              class="badge"
              [class.badge-success]="item.isActive"
              [class.badge-secondary]="!item.isActive">

              {{ item.isActive ? 'Yes' : 'No' }}

            </span>
          </td>
        </ng-container>

        <!-- Actions -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>
            Actions
          </th>

          <td mat-cell *matCellDef="let item">

            <a
              mat-icon-button
              color="primary"
              [routerLink]="['/clients/edit', item.id]"
              title="Edit">

              <mat-icon>edit</mat-icon>
            </a>

            <button
              *ngIf="auth.canDeleteProducts()"
              mat-icon-button
              color="warn"
              (click)="deleteClient(item.id)"
              title="Delete">

              <mat-icon>delete</mat-icon>
            </button>

          </td>
        </ng-container>

        <tr
          mat-header-row
          *matHeaderRowDef="displayedColumns">
        </tr>

        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns;">
        </tr>

        <tr class="mat-row" *matNoDataRow>
          <td
            class="mat-cell text-center py-3"
            [attr.colspan]="displayedColumns.length">

            {{ loading() ? 'Loading data...' : 'No clients found.' }}

          </td>
        </tr>

      </table>

      <mat-paginator
        [length]="totalItems()"
        [pageIndex]="pageIndex"
        [pageSize]="pageSize"
        [pageSizeOptions]="pageSizeOptions"
        (page)="onPageChange($event)"
        showFirstLastButtons>
      </mat-paginator>

    </div>
  </div>
</div>
