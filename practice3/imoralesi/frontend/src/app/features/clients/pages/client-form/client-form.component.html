<div class="p-6 max-w-3xl mx-auto">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">Add New Client</h2>
    <a routerLink="/clients" class="text-gray-600 hover:text-gray-900 font-medium">← Back to Clients</a>
  </div>

  <div class="bg-white shadow-md rounded-lg p-6 border border-gray-200">
    <form (ngSubmit)="onSubmit()" #clientForm="ngForm">
      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Name</label>
        <input 
          type="text" 
          name="name" 
          [(ngModel)]="client.name" 
          required 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter client name"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Email</label>
        <input 
          type="email" 
          name="email" 
          [(ngModel)]="client.email" 
          required 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter email address"
        />
      </div>

      <div class="mb-4">
        <label class="block text-sm font-medium text-gray-700 mb-2">Phone</label>
        <input 
          type="text" 
          name="phone" 
          [(ngModel)]="client.phone" 
          required 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter phone number"
        />
      </div>

      <div class="mb-6">
        <label class="block text-sm font-medium text-gray-700 mb-2">Address</label>
        <textarea 
          name="address" 
          [(ngModel)]="client.address" 
          rows="3" 
          class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="Enter physical address">
        </textarea>
      </div>

      <div class="flex justify-end space-x-4">
        <a routerLink="/clients" class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50 font-medium">Cancel</a>
        <button 
          type="submit" 
          [disabled]="!clientForm.form.valid || submitting" 
          class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-md font-medium shadow-sm transition disabled:opacity-50">
          {{ submitting ? 'Saving...' : 'Save Client' }}
        </button>
      </div>
    </form>
  </div>
</div>
