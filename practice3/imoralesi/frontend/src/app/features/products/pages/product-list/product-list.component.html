<div class="container">
  <header class="header">
    <h2>Enterprise Products</h2>
    <a *ngIf="auth.canManageProducts()" routerLink="/products/new" class="btn btn-primary">+ Add Product</a>
  </header>

  <!-- Botones de alternancia entre Offset y Scroll Infinito -->
  <div style="margin: 15px 0; display: flex; gap: 10px;">
    <button 
      type="button"
      class="btn" 
      [ngClass]="{'btn-primary': !isInfiniteScroll(), 'btn-secondary': isInfiniteScroll()}"
      (click)="togglePaginationMode(false)">
      Paginación Tradicional (Offset)
    </button>
    <button 
      type="button"
      class="btn" 
      [ngClass]="{'btn-primary': isInfiniteScroll(), 'btn-secondary': !isInfiniteScroll()}"
      (click)="togglePaginationMode(true)">
      Scroll Infinito
    </button>
  </div>

  <input type="text" placeholder="Search products... (press Enter)" [(ngModel)]="searchTerm" (keyup.enter)="onSearchChange()" class="search-bar" />

  <table class="grid-table" *ngIf="products().length > 0; else emptyOrLoading">
    <thead>
      <tr>
        <th (click)="toggleSort('name')">Name</th>
        <th>Description</th>
        <th (click)="toggleSort('price')">Price</th>
        <th (click)="toggleSort('stock')">Stock</th>
        <th *ngIf="auth.canManageProducts()">Actions</th>
      </tr>
    </thead>
    <tbody>
      <tr *ngFor="let item of products()">
        <td>{{ item.name }}</td>
        <td>{{ item.description || '-' }}</td>
        <td>${{ item.price | number:'1.2-2' }}</td>
        <td>{{ item.stock }}</td>
        <td *ngIf="auth.canManageProducts()">
          <a [routerLink]="['/products/edit', item.id]">Edit</a>
          <button *ngIf="auth.canDeleteProducts()" (click)="deleteProduct(item.id)" class="text-danger">Delete</button>
        </td>
      </tr>
    </tbody>
  </table>

  <!-- Paginación Tradicional (solo si Scroll Infinito está desactivado) -->
  <div class="pagination" *ngIf="!isInfiniteScroll() && totalPages() > 0">
    <button [disabled]="page() <= 1" (click)="setPage(page() - 1)">Prev</button>
    <span>Page {{ page() }} of {{ totalPages() }}</span>
    <button [disabled]="page() >= totalPages()" (click)="setPage(page() + 1)">Next</button>
  </div>

  <!-- Plantilla de Carga e Información Vacía -->
  <ng-template #emptyOrLoading>
    <div style="padding: 20px; text-align: center;">
      <span *ngIf="loading()">Loading data...</span>
      <span *ngIf="!loading() && products().length === 0">No products found.</span>
    </div>
  </ng-template>

  <!-- Indicador al hacer scroll infinito -->
  <div *ngIf="isInfiniteScroll() && loading() && products().length > 0" style="text-align: center; padding: 10px;">
    Loading more items...
  </div>
</div>
