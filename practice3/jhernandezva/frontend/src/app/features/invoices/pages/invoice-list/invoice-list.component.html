<div class="card">
  <div class="card-header d-flex justify-content-between align-items-center">
    <h3 class="card-title mb-0">Invoices</h3>
    <a *ngIf="auth.canManageProducts()" routerLink="/invoices/new" class="btn btn-primary btn-sm">
      + New Invoice
    </a>
  </div>

  <div class="card-body">
    <mat-form-field appearance="outline" class="search-field">
      <mat-label>Search by client</mat-label>
      <input matInput placeholder="Type and press Enter"
             [(ngModel)]="searchTerm" (keyup.enter)="onSearchChange()" />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <mat-progress-bar *ngIf="loading()" mode="indeterminate"></mat-progress-bar>

    <div class="mat-elevation-z1 table-container">
      <table mat-table [dataSource]="invoices()" matSort (matSortChange)="onSortChange($event)"
             [matSortActive]="sortBy" [matSortDirection]="sortDirection">

        <ng-container matColumnDef="client">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Client</th>
          <td mat-cell *matCellDef="let item">{{ item.clientName }}</td>
        </ng-container>

        <ng-container matColumnDef="issueDate">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Issue Date</th>
          <td mat-cell *matCellDef="let item">{{ item.issueDate | date:'mediumDate' }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
          <td mat-cell *matCellDef="let item">
            <span class="badge"
                  [class.badge-success]="item.status === 'Paid'"
                  [class.badge-secondary]="item.status === 'Pending'"
                  [class.badge-danger]="item.status === 'Cancelled'">
              {{ item.status }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="total">
          <th mat-header-cell *matHeaderCellDef mat-sort-header>Total</th>
          <td mat-cell *matCellDef="let item">{{ item.total | currency }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let item">
            <a mat-icon-button color="primary" [routerLink]="['/invoices/edit', item.id]" title="Edit">
              <mat-icon>edit</mat-icon>
            </a>
            <button *ngIf="auth.canDeleteProducts()" mat-icon-button color="warn"
                    (click)="deleteInvoice(item.id)" title="Delete">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center py-3" [attr.colspan]="displayedColumns.length">
            {{ loading() ? 'Loading data...' : 'No invoices found.' }}
          </td>
        </tr>
      </table>

      <mat-paginator [length]="totalItems()"
                     [pageIndex]="pageIndex"
                     [pageSize]="pageSize"
                     [pageSizeOptions]="pageSizeOptions"
                     (page)="onPageChange($event)"
                     showFirstLastButtons>
      </mat-paginator>
    </div>
  </div>
</div>
