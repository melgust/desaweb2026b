<div class="container"><header class="header"><h2>{{ id ? 'Edit Supplier' : 'Create Supplier' }}</h2><a routerLink="/suppliers" class="btn">Back to List</a></header><form (ngSubmit)="submit()"><div class="form-group"><label>Name</label><input class="form-control" [(ngModel)]="formData.name" name="name" required /></div><div class="form-group"><label>Contact Email</label><input class="form-control" type="email" [(ngModel)]="formData.contactEmail" name="contactEmail" /></div><div class="form-group"><label>Phone</label><input class="form-control" [(ngModel)]="formData.phone" name="phone" /></div><div class="form-group checkbox-group"><label><input type="checkbox" [(ngModel)]="formData.isActive" name="isActive" /> Is Active</label></div><button class="btn btn-primary" [disabled]="loading">{{ id ? 'Update Supplier' : 'Create Supplier' }}</button></form></div>
