<div class="container"><header class="header"><h2>Invoices</h2><a *ngIf="auth.canManageProducts()" routerLink="/invoices/new" class="btn btn-primary">+ New Invoice</a></header>
<table class="grid-table"><thead><tr><th>Invoice Number</th><th>Client</th><th>Date</th><th>Total</th><th>Action</th></tr></thead><tbody><tr *ngFor="let item of invoices()"><td>{{ item.invoiceNumber }}</td><td>{{ item.clientName }}</td><td>{{ item.date | date:'medium' }}</td><td>Q{{ item.total | number:'1.2-2' }}</td><td><a [routerLink]="['/invoices', item.id]">View Detail</a></td></tr></tbody></table>
<div class="pagination" *ngIf="totalPages()"><button [disabled]="page() <= 1" (click)="setPage(page()-1)">Prev</button><span>Page {{ page() }} of {{ totalPages() }}</span><button [disabled]="page() >= totalPages()" (click)="setPage(page()+1)">Next</button></div><div *ngIf="loading()">Loading data...</div></div>
