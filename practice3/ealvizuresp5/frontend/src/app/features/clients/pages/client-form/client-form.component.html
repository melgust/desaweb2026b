<div class="container"><header class="header"><h2>{{ id ? 'Edit Client' : 'Create Client' }}</h2><a routerLink="/clients" class="btn">Back to List</a></header><form (ngSubmit)="submit()"><div class="form-group"><label>Name</label><input class="form-control" [(ngModel)]="formData.name" name="name" required /></div><div class="form-group"><label>Email</label><input class="form-control" type="email" [(ngModel)]="formData.email" name="email" required /></div><div class="form-group"><label>Phone</label><input class="form-control" [(ngModel)]="formData.phone" name="phone" /></div><div class="form-group"><label>Address</label><textarea class="form-control" [(ngModel)]="formData.address" name="address"></textarea></div><div class="form-group checkbox-group"><label><input type="checkbox" [(ngModel)]="formData.isActive" name="isActive" /> Is Active</label></div><p class="error" *ngIf="error">{{ error }}</p><button class="btn btn-primary" [disabled]="loading">{{ id ? 'Update Client' : 'Create Client' }}</button></form></div>
