<div class="container"><header class="header"><h2>Clients</h2><a *ngIf="auth.canManageProducts()" routerLink="/clients/new" class="btn btn-primary">+ Add Client</a></header>
<input class="search-bar" [(ngModel)]="searchTerm" (keyup.enter)="search()" placeholder="Search clients... (press Enter)" />
<table class="grid-table"><thead><tr><th (click)="sort('name')">Name</th><th (click)="sort('email')">Email</th><th>Phone</th><th>Address</th><th>Active</th><th *ngIf="auth.canManageProducts()">Actions</th></tr></thead><tbody><tr *ngFor="let item of clients()"><td>{{ item.name }}</td><td>{{ item.email }}</td><td>{{ item.phone || '-' }}</td><td>{{ item.address || '-' }}</td><td>{{ item.isActive ? 'Yes' : 'No' }}</td><td *ngIf="auth.canManageProducts()"><a [routerLink]="['/clients/edit', item.id]">Edit</a><button *ngIf="auth.canDeleteProducts() && item.isActive" class="text-danger" (click)="deactivate(item.id)">Deactivate</button></td></tr></tbody></table>
<div class="pagination" *ngIf="totalPages()"><button [disabled]="page() <= 1" (click)="setPage(page()-1)">Prev</button><span>Page {{ page() }} of {{ totalPages() }}</span><button [disabled]="page() >= totalPages()" (click)="setPage(page()+1)">Next</button></div><div *ngIf="loading()">Loading data...</div></div>
