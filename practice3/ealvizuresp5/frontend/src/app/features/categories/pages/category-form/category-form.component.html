<div class="container"><header class="header"><h2>{{ id ? 'Edit Category' : 'Create Category' }}</h2><a routerLink="/categories" class="btn">Back to List</a></header><form (ngSubmit)="submit()"><div class="form-group"><label>Name</label><input class="form-control" [(ngModel)]="formData.name" name="name" required /></div><div class="form-group"><label>Description</label><textarea class="form-control" [(ngModel)]="formData.description" name="description" rows="3"></textarea></div><div class="form-group checkbox-group"><label><input type="checkbox" [(ngModel)]="formData.isActive" name="isActive" /> Is Active</label></div><button class="btn btn-primary" [disabled]="loading">{{ id ? 'Update Category' : 'Create Category' }}</button></form></div>
