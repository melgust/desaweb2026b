<div class="container"><header class="header"><h2>Categories</h2><a *ngIf="auth.canManageProducts()" routerLink="/categories/new" class="btn btn-primary">+ Add Category</a></header>
<input class="search-bar" [(ngModel)]="searchTerm" (keyup.enter)="search()" placeholder="Search categories... (press Enter)" />
<table class="grid-table"><thead><tr><th (click)="sort('name')">Name</th><th>Description</th><th>Active</th><th *ngIf="auth.canManageProducts()">Actions</th></tr></thead><tbody><tr *ngFor="let item of categories()"><td>{{ item.name }}</td><td>{{ item.description || '-' }}</td><td>{{ item.isActive ? 'Yes' : 'No' }}</td><td *ngIf="auth.canManageProducts()"><a [routerLink]="['/categories/edit', item.id]">Edit</a><button *ngIf="auth.canDeleteProducts()" class="text-danger" (click)="delete(item.id)">Delete</button></td></tr></tbody></table>
<div class="pagination" *ngIf="totalPages()"><button [disabled]="page() <= 1" (click)="setPage(page()-1)">Prev</button><span>Page {{ page() }} of {{ totalPages() }}</span><button [disabled]="page() >= totalPages()" (click)="setPage(page()+1)">Next</button></div><div *ngIf="loading()">Loading data...</div></div>
