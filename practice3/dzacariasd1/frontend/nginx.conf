# Configuracion de Nginx para servir la SPA de Angular.
# try_files reenvia cualquier ruta desconocida a index.html para que el router
# de Angular pueda resolverla (sin esto, recargar /products devuelve 404).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
