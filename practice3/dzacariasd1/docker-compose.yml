version: '3.8'

services:
  db:
    image: mysql:8.0
    container_name: enterprise_db_dzacariasd1
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: YourSecurePassword123!
      MYSQL_DATABASE: EnterpriseDb
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: enterprise_backend_dzacariasd1
    restart: always
    ports:
      - "5000:80"
    environment:
      - ConnectionStrings__DefaultConnection=Server=db;Database=EnterpriseDb;User Id=root;Password=YourSecurePassword123!;
      # Development habilita Swagger en http://localhost:5000/swagger
      - ASPNETCORE_ENVIRONMENT=Development
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: enterprise_frontend_dzacariasd1
    restart: always
    ports:
      - "81:80"
    depends_on:
      - backend

volumes:
  db_data: