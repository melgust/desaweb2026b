<div class="max-w-3xl mx-auto bg-white p-6 rounded-lg shadow-md mt-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-2xl font-bold text-gray-800">
      {{ isEditMode() ? 'Edit Product' : 'Create New Product' }}
    </h2>
    <a routerLink="/products" class="text-indigo-600 hover:text-indigo-800 font-medium">
      Back to List
    </a>
  </div>

  <form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="space-y-4">
    <!-- Product Name -->
    <div>
      <label for="name" class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
      <input
        type="text"
        id="name"
        formControlName="name"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Enter product name"
      />
      <div *ngIf="productForm.get('name')?.touched && productForm.get('name')?.invalid" class="text-red-500 text-xs mt-1">
        Name is required (max 150 characters).
      </div>
    </div>

    <!-- Description -->
    <div>
      <label for="description" class="block text-sm font-medium text-gray-700 mb-1">Description</label>
      <textarea
        id="description"
        formControlName="description"
        rows="3"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        placeholder="Enter description"
      ></textarea>
    </div>

    <!-- Category Dropdown -->
    <div>
      <label for="categoryId" class="block text-sm font-medium text-gray-700 mb-1">Category</label>
      <select
        id="categoryId"
        formControlName="categoryId"
        class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm bg-white focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
      >
        <option value="">-- Select Category --</option>
        <option *ngFor="let cat of categories()" [value]="cat.id">
          {{ cat.name }}
        </option>
      </select>
      <div *ngIf="productForm.get('categoryId')?.touched && productForm.get('categoryId')?.invalid" class="text-red-500 text-xs mt-1">
        Please select a category.
      </div>
    </div>

    <!-- Price and Stock Row -->
    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
      <div>
        <label for="price" class="block text-sm font-medium text-gray-700 mb-1">Price ($)</label>
        <input
          type="number"
          id="price"
          step="0.01"
          formControlName="price"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
        <div *ngIf="productForm.get('price')?.touched && productForm.get('price')?.invalid" class="text-red-500 text-xs mt-1">
          Price must be greater than 0.
        </div>
      </div>

      <div>
        <label for="stock" class="block text-sm font-medium text-gray-700 mb-1">Stock Quantity</label>
        <input
          type="number"
          id="stock"
          formControlName="stock"
          class="w-full px-3 py-2 border border-gray-300 rounded-md shadow-sm focus:outline-none focus:ring-indigo-500 focus:border-indigo-500"
        />
        <div *ngIf="productForm.get('stock')?.touched && productForm.get('stock')?.invalid" class="text-red-500 text-xs mt-1">
          Stock must be a positive number.
        </div>
      </div>
    </div>

    <!-- Is Active Checkbox -->
    <div class="flex items-center pt-2">
      <input
        type="checkbox"
        id="isActive"
        formControlName="isActive"
        class="h-4 w-4 text-indigo-600 focus:ring-indigo-500 border-gray-300 rounded"
      />
      <label for="isActive" class="ml-2 block text-sm text-gray-900 font-medium">
        Is Active
      </label>
    </div>

    <!-- Submit Button -->
    <div class="pt-4">
      <button
        type="submit"
        [disabled]="loading()"
        class="w-full md:w-auto px-6 py-2 bg-blue-600 text-white rounded-md font-medium hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 disabled:opacity-50"
      >
        {{ loading() ? 'Saving...' : (isEditMode() ? 'Update Product' : 'Create Product') }}
      </button>
    </div>
  </form>
</div>
