<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Person Profile</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" rel="stylesheet">

    <style>
        body {
            background: linear-gradient(135deg, #eef2ff, #f8fafc);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", sans-serif;
        }

        .profile-card {
            max-width: 600px;
            width: 100%;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0,0,0,.1);
        }

        .profile-header {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            text-align: center;
            padding: 2rem;
        }

        .avatar {
            width: 90px;
            height: 90px;
            background: rgba(255,255,255,.2);
            border-radius: 50%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 2.5rem;
            margin-bottom: 1rem;
        }

        .info-label {
            font-size: .85rem;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: .05rem;
        }

        .info-value {
            font-size: 1rem;
            font-weight: 600;
            color: #212529;
        }

        .info-row {
            padding: 1rem;
            border-bottom: 1px solid #f1f1f1;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 45px;
            height: 45px;
            background: #e9f2ff;
            color: #0d6efd;
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>

<div class="card profile-card">

    <div class="profile-header">
        <div class="avatar">
            <i class="bi bi-person-fill"></i>
        </div>
        <h2 class="mb-0">Emersson Steve Alvizures Palma</h2>
        <small>Person Profile</small>
    </div>

    <div class="card-body p-0">

        <div class="info-row d-flex align-items-center">
            <div class="icon-box me-3">
                <i class="bi bi-person"></i>
            </div>
            <div>
                <div class="info-label">Full Name</div>
                <div class="info-value">John Doe</div>
            </div>
        </div>

        <div class="info-row d-flex align-items-center">
            <div class="icon-box me-3">
                <i class="bi bi-envelope"></i>
            </div>
            <div>
                <div class="info-label">Email</div>
                <div class="info-value">john.doe@example.com</div>
            </div>
        </div>

        <div class="info-row d-flex align-items-center">
            <div class="icon-box me-3">
                <i class="bi bi-calendar-event"></i>
            </div>
            <div>
                <div class="info-label">Birthday</div>
                <div class="info-value">January 15, 1995</div>
            </div>
        </div>

        <div class="info-row d-flex align-items-center">
            <div class="icon-box me-3">
                <i class="bi bi-gender-ambiguous"></i>
            </div>
            <div>
                <div class="info-label">Sex</div>
                <div class="info-value">Male</div>
            </div>
        </div>

    </div>

    <div class="card-footer bg-white text-center">
        <button class="btn btn-primary px-4">
            <i class="bi bi-pencil-square"></i> Edit Profile
        </button>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
