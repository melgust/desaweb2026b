<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jimmy Hernandez | Personal Profile</title>

    <!-- Bootstrap 5.3 -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" rel="stylesheet">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-family: "Segoe UI", sans-serif;
            background: linear-gradient(135deg, #0d6efd, #6ea8fe);
        }

        .profile-card {
            width: 100%;
            max-width: 650px;
            border: none;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(0, 0, 0, .25);
        }

        .profile-header {
            background: linear-gradient(135deg, #0d6efd, #4f8cff);
            color: white;
            text-align: center;
            padding: 35px;
        }

        .avatar {
            width: 110px;
            height: 110px;
            background: rgba(255, 255, 255, .2);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            margin: auto;
            margin-bottom: 15px;
            font-size: 50px;
        }

        .profile-header h2 {
            font-weight: bold;
            margin-bottom: 5px;
        }

        .profile-header p {
            margin: 0;
            opacity: .9;
        }

        .info-row {
            display: flex;
            align-items: center;
            padding: 18px 25px;
            border-bottom: 1px solid #ececec;
        }

        .info-row:last-child {
            border-bottom: none;
        }

        .icon-box {
            width: 55px;
            height: 55px;
            border-radius: 15px;
            background: #e8f2ff;
            color: #0d6efd;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 22px;
            margin-right: 18px;
        }

        .info-label {
            font-size: 13px;
            color: #6c757d;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-value {
            font-size: 18px;
            font-weight: 600;
            color: #212529;
        }

        .card-footer {
            background: white;
            text-align: center;
            padding: 25px;
        }

        .btn-profile {
            border-radius: 30px;
            padding: 10px 35px;
            font-weight: 600;
        }
    </style>
</head>

<body>

    <div class="card profile-card">

        <div class="profile-header">

            <div class="avatar">
                <i class="bi bi-person-fill"></i>
            </div>

            <h2>Jimmy Hernandez</h2>
            <p>Personal Profile</p>

        </div>

        <div class="card-body p-0">

            <!-- Name -->
            <div class="info-row">

                <div class="icon-box">
                    <i class="bi bi-person"></i>
                </div>

                <div>
                    <div class="info-label">Name</div>
                    <div class="info-value">Jimmy Hernandez</div>
                </div>

            </div>

            <!-- Date of Birth -->
            <div class="info-row">

                <div class="icon-box">
                    <i class="bi bi-calendar-event"></i>
                </div>

                <div>
                    <div class="info-label">Date of Birth</div>
                    <div class="info-value">May 10, 2002</div>
                </div>

            </div>

            <!-- Email -->
            <div class="info-row">

                <div class="icon-box">
                    <i class="bi bi-envelope-fill"></i>
                </div>

                <div>
                    <div class="info-label">Email</div>
                    <div class="info-value">jimmy.hernandez@email.com</div>
                </div>

            </div>

            <!-- Favorite Color -->
            <div class="info-row">

                <div class="icon-box">
                    <i class="bi bi-palette-fill"></i>
                </div>

                <div>
                    <div class="info-label">Favorite Color</div>
                    <div class="info-value">Blue</div>
                </div>

            </div>

        </div>

        <div class="card-footer">

            <button class="btn btn-primary btn-profile">
                <i class="bi bi-pencil-square"></i>
                Edit Profile
            </button>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
